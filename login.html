<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shadow | Login</title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- Bootstrap Icons -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    >


    <!-- Google Font -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&display=swap"
        rel="stylesheet"
    >


    <style>

        body {

            margin: 0;

            min-height: 100vh;

            background: rgb(59, 5, 5);

            font-family: Arial, sans-serif;

            display: flex;

            justify-content: center;

            align-items: center;

        }


        .login-container {

            width: 900px;

            max-width: 100%;

            background: white;

            padding: 40px;

            border-radius: 20px;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);

        }


        .logo {

            text-align: center;

            font-family: "UnifrakturMaguntia", cursive;

            font-size: 45px;

            color: #460202;

            margin-bottom: 10px;

        }


        .login-title {

            text-align: center;

            color: #460202;

            margin-bottom: 30px;

        }


        .form-control {

            height: 48px;

            border-radius: 10px;

        }


        .login-btn {

            width: 100%;

            height: 48px;

            background-color: #460202;

            color: white;

            border: none;

            border-radius: 10px;

            font-weight: bold;

            margin-top: 10px;

        }


        .login-btn:hover {

            background-color: #650505;

            color: white;

        }


        .forgot-password {

            text-align: right;

            margin-top: -10px;

            margin-bottom: 15px;

        }


        .forgot-password a {

            color: #460202;

            font-weight: bold;

            text-decoration: none;

        }


        .forgot-password a:hover {

            text-decoration: underline;

        }


        .signup-link {

            text-align: center;

            margin-top: 20px;

        }


        .signup-link a {

            color: #460202;

            font-weight: bold;

            text-decoration: none;

        }


        .back-home {

            text-align: center;

            margin-top: 15px;

        }


        .back-home a {

            color: #555;

            text-decoration: none;

        }


        #loginMessage {

            display: none;

            margin-top: 15px;

        }

    </style>

</head>


<body>


<div class="login-container">


    <!-- LOGO -->

    <div class="logo">

        <i class="bi bi-bag"></i> Shadow

    </div>


    <!-- TITLE -->

    <h3 class="login-title">

        Welcome Back

    </h3>


    <!-- LOGIN FORM -->

    <form id="loginForm">


        <!-- EMAIL -->

        <div class="mb-3">

            <label for="loginEmail" class="form-label">

                Email

            </label>

            <input
                type="email"
                class="form-control"
                id="loginEmail"
                placeholder="Enter your email"
                required
            >

        </div>


        <!-- PASSWORD -->

        <div class="mb-3">

            <label for="loginPassword" class="form-label">

                Password

            </label>

            <input
                type="password"
                class="form-control"
                id="loginPassword"
                placeholder="Enter your password"
                required
            >

        </div>


        <!-- FORGOT PASSWORD -->

        <div class="forgot-password">

            <a href="reset-password.html">

                Forgot Password?

            </a>

        </div>


        <!-- LOGIN BUTTON -->

        <button
            type="submit"
            class="login-btn"
        >

            Login

        </button>


        <!-- MESSAGE -->

        <div
            id="loginMessage"
            class="alert"
        ></div>


    </form>


    <!-- SIGN UP -->

    <div class="signup-link">

        Don't have an account?

        <a href="signup.html">

            Create Account

        </a>

    </div>


    <!-- HOME -->

    <div class="back-home">

        <a href="shadow.html">

            <i class="bi bi-arrow-left"></i>

            Back to Home

        </a>

    </div>


</div>


<script>


document

    .getElementById("loginForm")

    .addEventListener("submit", function(event) {


        event.preventDefault();


        /* ================= GET FORM VALUES ================= */


        const email =

            document

            .getElementById("loginEmail")

            .value

            .trim()

            .toLowerCase();


        const password =

            document

            .getElementById("loginPassword")

            .value;


        const message =

            document

            .getElementById("loginMessage");


        /* ================= GET SAVED USER ================= */


        const savedUserData =

            localStorage.getItem("shadowUser");


        /* ================= CHECK ACCOUNT ================= */


        if (!savedUserData) {

            message.style.display = "block";

            message.className =
                "alert alert-danger";

            message.textContent =
                "No account found. Please create an account first.";

            return;

        }


        /* ================= CONVERT SAVED USER ================= */


        const savedUser =

            JSON.parse(savedUserData);


        /* ================= CHECK LOGIN DETAILS ================= */


        if (

            email === savedUser.email &&

            password === savedUser.password

        ) {


            /* ================= SAVE LOGIN STATUS ================= */


            localStorage.setItem(

                "shadowLoggedIn",

                "true"

            );


            /* ================= SAVE CURRENT USER ================= */


            localStorage.setItem(

                "shadowCurrentUser",

                JSON.stringify({

                    name: savedUser.name,

                    email: savedUser.email

                })

            );


            /* ================= SUCCESS MESSAGE ================= */


            message.style.display = "block";

            message.className =
                "alert alert-success";

            message.textContent =
                "Login successful!";


            /* ================= GO TO HOME ================= */


            setTimeout(function() {

                window.location.href =
                    "shadow.html";

            }, 1000);


        } else {


            /* ================= WRONG LOGIN ================= */


            message.style.display = "block";

            message.className =
                "alert alert-danger";

            message.textContent =
                "Incorrect email or password.";

        }

    });


</script>


</body>

</html>
