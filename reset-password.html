<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shadow | Reset Password</title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- Bootstrap Icons -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    >


    <!-- Google Font -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&display=swap"
        rel="stylesheet"
    >


    <style>

        body {

            margin: 0;

            min-height: 100vh;

            background: rgb(59, 5, 5);

            font-family: Arial, sans-serif;

            display: flex;

            justify-content: center;

            align-items: center;

        }


        .reset-container {

            width: 900px;

            max-width: 100%;

            background: white;

            padding: 40px;

            border-radius: 20px;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);

        }


        .logo {

            text-align: center;

            font-family: "UnifrakturMaguntia", cursive;

            font-size: 45px;

            color: #460202;

            margin-bottom: 10px;

        }


        .reset-title {

            text-align: center;

            color: #460202;

            margin-bottom: 10px;

        }


        .reset-description {

            text-align: center;

            color: #666;

            margin-bottom: 30px;

        }


        .form-control {

            height: 48px;

            border-radius: 10px;

        }


        .reset-btn {

            width: 100%;

            height: 48px;

            background-color: #460202;

            color: white;

            border: none;

            border-radius: 10px;

            font-weight: bold;

            margin-top: 10px;

        }


        .reset-btn:hover {

            background-color: #650505;

            color: white;

        }


        .login-link {

            text-align: center;

            margin-top: 20px;

        }


        .login-link a {

            color: #460202;

            font-weight: bold;

            text-decoration: none;

        }


        .back-home {

            text-align: center;

            margin-top: 15px;

        }


        .back-home a {

            color: #555;

            text-decoration: none;

        }


        #resetMessage {

            display: none;

            margin-top: 15px;

        }

    </style>

</head>


<body>


<div class="reset-container">


    <!-- LOGO -->

    <div class="logo">

        <i class="bi bi-bag"></i> Shadow

    </div>


    <!-- TITLE -->

    <h3 class="reset-title">

        Reset Password

    </h3>


    <p class="reset-description">

        Enter your registered email and choose a new password.

    </p>


    <!-- RESET FORM -->

    <form id="resetForm">


        <!-- EMAIL -->

        <div class="mb-3">

            <label for="resetEmail" class="form-label">

                Email

            </label>

            <input
                type="email"
                class="form-control"
                id="resetEmail"
                placeholder="Enter your registered email"
                required
            >

        </div>


        <!-- NEW PASSWORD -->

        <div class="mb-3">

            <label for="newPassword" class="form-label">

                New Password

            </label>

            <input
                type="password"
                class="form-control"
                id="newPassword"
                placeholder="Enter new password"
                required
            >

        </div>


        <!-- CONFIRM PASSWORD -->

        <div class="mb-3">

            <label for="confirmPassword" class="form-label">

                Confirm New Password

            </label>

            <input
                type="password"
                class="form-control"
                id="confirmPassword"
                placeholder="Confirm new password"
                required
            >

        </div>


        <!-- RESET BUTTON -->

        <button
            type="submit"
            class="reset-btn"
        >

            Reset Password

        </button>


        <!-- MESSAGE -->

        <div id="resetMessage" class="alert"></div>


    </form>


    <!-- LOGIN -->

    <div class="login-link">

        Remember your password?

        <a href="login.html">

            Login

        </a>

    </div>


    <!-- HOME -->

    <div class="back-home">

        <a href="shadow.html">

            <i class="bi bi-arrow-left"></i>

            Back to Home

        </a>

    </div>


</div>


<script>


document
    .getElementById("resetForm")
    .addEventListener("submit", function(event) {


        event.preventDefault();


        /* ================= GET FORM VALUES ================= */


        const email =

            document
                .getElementById("resetEmail")
                .value
                .trim()
                .toLowerCase();


        const newPassword =

            document
                .getElementById("newPassword")
                .value;


        const confirmPassword =

            document
                .getElementById("confirmPassword")
                .value;


        const message =

            document
                .getElementById("resetMessage");


        /* ================= GET SAVED USER ================= */


        const savedUserData =

            localStorage.getItem("shadowUser");


        /* ================= CHECK ACCOUNT ================= */


        if (!savedUserData) {

            message.style.display = "block";

            message.className =
                "alert alert-danger";

            message.textContent =
                "No account found. Please create an account first.";

            return;

        }


        /* ================= CONVERT SAVED USER ================= */


        const savedUser =

            JSON.parse(savedUserData);


        /* ================= CHECK EMAIL ================= */


        if (email !== savedUser.email.toLowerCase()) {

            message.style.display = "block";

            message.className =
                "alert alert-danger";

            message.textContent =
                "No account found with this email.";

            return;

        }


        /* ================= CHECK PASSWORD ================= */


        if (newPassword.length < 6) {

            message.style.display = "block";

            message.className =
                "alert alert-danger";

            message.textContent =
                "Password must be at least 6 characters.";

            return;

        }


        /* ================= CONFIRM PASSWORD ================= */


        if (newPassword !== confirmPassword) {

            message.style.display = "block";

            message.className =
                "alert alert-danger";

            message.textContent =
                "Passwords do not match.";

            return;

        }


        /* ================= UPDATE PASSWORD ================= */


        savedUser.password = newPassword;


        /* ================= SAVE UPDATED USER ================= */


        localStorage.setItem(

            "shadowUser",

            JSON.stringify(savedUser)

        );


        /* ================= REMOVE OLD LOGIN ================= */


        localStorage.removeItem("shadowLoggedIn");

        localStorage.removeItem("shadowCurrentUser");


        /* ================= SUCCESS MESSAGE ================= */


        message.style.display = "block";

        message.className =
            "alert alert-success";

        message.textContent =
            "Password reset successfully! Redirecting to login...";


        /* ================= GO TO LOGIN ================= */


        setTimeout(function() {

            window.location.href = "login.html";

        }, 1500);


    });


</script>


</body>

</html>
