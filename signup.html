<style>

    /* ================= BODY ================= */

    body {

        margin: 0;

        min-height: 100vh;

        background: rgb(61, 5, 5);

        font-family: Arial, sans-serif;

        display: flex;

        justify-content: center;

        align-items: center;

    /* ================= SIGNUP BOX ================= */

        width: 900px;

    /* ================= TITLE ================= */

    /* ================= INPUTS ================= */

        border-radius: 10px;

    }


    /* ================= SIGNUP BUTTON ================= */

        }

</style>

</head>

<body>

```
<!-- ================= SIGNUP CONTAINER ================= -->

<div class="signup-container">


    <!-- LOGO -->

    <div class="logo">

        <i class="bi bi-bag"></i> Shadow

    </div>


    <!-- TITLE -->

    <h3 class="signup-title">

        Create Account

    </h3>


    <!-- ================= SIGNUP FORM ================= -->

    <form id="signupForm">


        <!-- NAME -->

        <div class="mb-3">

            <label
                for="signupName"
                class="form-label">

                Full Name

            </label>

            <input
                type="text"
                class="form-control"
                id="signupName"
                placeholder="Enter your full name"
                required>

        </div>


        <!-- EMAIL -->

        <div class="mb-3">

            <label
                for="signupEmail"
                class="form-label">

                Email

            </label>

            <input
                type="email"
                class="form-control"
                id="signupEmail"
                placeholder="Enter your email"
                required>

        </div>


        <!-- PASSWORD -->

        <div class="mb-3">

            <label
                for="signupPassword"
                class="form-label">

                Password

            </label>

            <input
                type="password"
                class="form-control"
                id="signupPassword"
                placeholder="Create a password"
                minlength="6"
                required>

            <small class="text-muted">

                Password must contain at least 6 characters.

            </small>

        </div>


        <!-- CONFIRM PASSWORD -->

        <div class="mb-3">

            <label
                for="confirmPassword"
                class="form-label">

                Confirm Password

            </label>

            <input
                type="password"
                class="form-control"
                id="confirmPassword"
                placeholder="Confirm your password"
                minlength="6"
                required>

        </div>


        <!-- SIGNUP BUTTON -->

        <button
            type="submit"
            class="signup-btn">

            Create Account

        </button>


        <!-- MESSAGE -->

        <div
            id="signupMessage"
            class="alert">

        </div>


    </form>


    <!-- ================= LOGIN ================= -->

    <div class="login-link">

        Already have an account?

        <a href="login.html">

            Login

        </a>

    </div>


    <!-- ================= HOME ================= -->

    <div class="back-home">

        <a href="shadow.html">

            <i class="bi bi-arrow-left"></i>

            Back to Home

        </a>

    </div>


</div>


<!-- ================= JAVASCRIPT ================= -->

<script>

    document
        .getElementById("signupForm")
        .addEventListener("submit", function(event) {


            /* Prevent page refresh */

            event.preventDefault();


            /* Get form values */

            const name =
                document
                .getElementById("signupName")
                .value
                .trim();


            const email =
                document
                .getElementById("signupEmail")
                .value
                .trim()
                .toLowerCase();


            const password =
                document
                .getElementById("signupPassword")
                .value;


            const confirmPassword =
                document
                .getElementById("confirmPassword")
                .value;


            const message =
                document
                .getElementById("signupMessage");


            /* ================= CHECK PASSWORD ================= */

            if (password !== confirmPassword) {

                message.style.display = "block";

                message.className =
                    "alert alert-danger";

                message.textContent =
                    "Passwords do not match.";

                return;

            }


            /* ================= CHECK EXISTING ACCOUNT ================= */

            const existingUser =
                localStorage.getItem("shadowUser");


            if (existingUser) {

                const user =
                    JSON.parse(existingUser);


                if (user.email === email) {

                    message.style.display = "block";

                    message.className =
                        "alert alert-danger";

                    message.textContent =
                        "An account with this email already exists.";

                    return;

                }

            }


            /* ================= CREATE USER ================= */

            const newUser = {

                name: name,

                email: email,

                password: password

            };


            /* ================= SAVE USER ================= */

            localStorage.setItem(
                "shadowUser",
                JSON.stringify(newUser)
            );


            /* ================= SUCCESS MESSAGE ================= */

            message.style.display = "block";

            message.className =
                "alert alert-success";

            message.textContent =
                "Account created successfully!";


            /* ================= GO TO LOGIN ================= */

            setTimeout(function() {

                window.location.href =
                    "login.html";

            }, 1200);


        });

</script>
